services:
  - type: web
    name: aptimedha
    env: docker
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: APP_NAME
        value: AptiMedha
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync

